# nginx: social.54ucl.com -> dashboard FastAPI (127.0.0.1:8000)，含 HTTPS + Basic Auth
# 安裝（取得 certbot 憑證之後）：
#   sudo cp deploy/social.54ucl.com.conf /etc/nginx/conf.d/social.54ucl.com.conf
#   sudo nginx -t && sudo systemctl reload nginx

upstream social_app {
    server 127.0.0.1:8000;
    keepalive 16;
}

# HTTP -> HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name social.54ucl.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name social.54ucl.com;

    server_tokens off;

    ssl_certificate     /etc/letsencrypt/live/social.54ucl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/social.54ucl.com/privkey.pem;

    # ---- 安全性 header ----
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # Dashboard 使用 inline script/style 與 onclick，所以需要 'unsafe-inline'；不從外部載入任何資源
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    access_log /var/log/nginx/social.54ucl.com.access.log combined;
    error_log  /var/log/nginx/social.54ucl.com.error.log warn;

    # ---- 整個網站皆須登入 (Basic Auth) ----
    auth_basic           "Social Login Dashboard";
    auth_basic_user_file /etc/nginx/.htpasswd-social;

    # 根頁面 -> dashboard
    location = / {
        return 302 /dashboard;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location / {
        limit_req  zone=app_api burst=40 nodelay;
        limit_conn app_conn 20;

        proxy_pass http://social_app;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
